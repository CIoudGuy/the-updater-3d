[package]
name = "the-updater-3d"
version = "1.1.0"
description = "Updates Adobe apps, Blender and the Craft apps"
edition = "2021"
rust-version = "1.90"

[lib]
name = "updater_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip", "brotli"] }
futures-util = "0.3"
roxmltree = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
winreg = "0.56"
sysinfo = "0.37"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
anyhow = "1"
log = "0.4"
regex = "1"
once_cell = "1"
png = "0.18"
mslnk = "0.1"
base64 = "0.22"
yaml-rust2 = "0.13"
fancy-regex = "0.19"
miniz_oxide = "0.9"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_Com",
  "Win32_Graphics_Gdi",
  "Win32_Security_Authorization",
  "Win32_System_TaskScheduler",
  "Win32_System_Variant",
  "Win32_Security_Cryptography",
  "Win32_Security_WinTrust",
  "Win32_Security_Cryptography_Catalog",
  "Win32_Security_Cryptography_Sip",
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"

[dev-dependencies]
